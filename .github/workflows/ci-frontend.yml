name: Frontend CI

on:
  push:
    branches: [develop]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # ci (not install) does a clean install strictly from package-lock.json,
      # and fails if the lockfile is out of sync instead of silently updating it
      - run: npm ci
      - run: npm run lint

      - run: npm run format:check

      # non-blocking for now — audit findings on transitive deps are often noisy;
      # remove continue-on-error once the dependency tree's been triaged
      - run: npm audit --audit-level=high
        continue-on-error: true

      # runs last since it's the most expensive step — no point building
      # if lint/format/audit already caught something
      - run: npm run build
