name: Security CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 pulls full git history (not just the latest commit)
      # so Gitleaks can scan past commits for leaked secrets, not just current files
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # v3, not v2 — v2 depends on Node 20 which GitHub is dropping from
      # hosted runners on 2026-09-16. GITHUB_TOKEN is auto-provided by GitHub,
      # no secret to create. No GITLEAKS_LICENSE needed since this is a
      # personal-account repo, not an organization
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  codeql:
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false so one language failing doesn't cancel the other's scan
      fail-fast: false
      matrix:
        include:
          # JS/TS is interpreted — no build needed to analyze it
          - language: javascript-typescript
            build-mode: none
          # C# is compiled — CodeQL needs to actually build it to trace through
          - language: csharp
            build-mode: autobuild

    steps:
      - uses: actions/checkout@v4

      # only needed for the csharp matrix entry — CodeQL needs the .NET SDK
      # on the runner to actually build and trace through compiled code
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # sets up the CodeQL database for this matrix language; build-mode
      # tells it whether to build the code (csharp) or just scan source (js/ts)
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # runs the actual analysis and uploads findings to the Security tab;
      # category keeps js/ts and csharp results separate instead of overwriting
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  trivy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: weatherapp-backend
            context: ./backend
          - image: weatherapp-frontend
            context: ./frontend
    steps:
      # needed so Docker has the Dockerfile + source to build from
      - uses: actions/checkout@v4

      # Trivy scans built images, not Dockerfiles directly, so each image
      # has to be built locally on the runner before it can be scanned
      - name: Build image
        run: docker build -t ${{ matrix.image }}:scan ${{ matrix.context }}

      # SHA-pinned, not tag-pinned: this action was compromised in March 2026
      # via a tag-hijack (attacker moved old tags to malicious commits).
      # SHA refs can't be redirected the way tags can.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          format: sarif
          output: trivy-results.sarif
          # CRITICAL/HIGH only — base images like node:alpine surface dozens
          # of low-severity findings that add noise without much value
          severity: CRITICAL,HIGH

      # reuses CodeQL's own upload action so results land in the same
      # Security tab; category keeps backend/frontend scans separate
      # instead of overwriting each other
      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: "trivy-${{ matrix.image }}"
