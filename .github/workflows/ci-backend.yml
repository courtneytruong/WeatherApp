name: Backend CI

on:
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore

      # Fails if any files aren't formatted per .editorconfig/dotnet format rules
      - run: dotnet format --verify-no-changes

      # --no-restore since dependencies were already restored above
      - run: dotnet build --no-restore

      # dotnet list package --vulnerable always exits 0 regardless of findings,
      # so we capture its output and grep for the warning text to fail manually
      - name: Check for vulnerable packages
        run: |
          output=$(dotnet list package --vulnerable --include-transitive)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "Vulnerable packages found!"
            exit 1
          fi
